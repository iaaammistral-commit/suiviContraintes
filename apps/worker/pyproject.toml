[project]
name = "suivi-contraintes-worker"
version = "0.1.0"
description = "Worker Mistral Workflows : alerte email des depassements de contraintes"
requires-python = ">=3.11"
dependencies = [
    "mistralai-workflows[mistralai]>=3.18.0",
    "pandas>=2.0",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
